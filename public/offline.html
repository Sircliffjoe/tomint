<!doctype html>
<html lang="en">
  <head>
    <title>Offline | TOM Int.</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14532d">
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #10231d;
        background: linear-gradient(180deg, #f7fbf8, #e8f5ed);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 34rem);
        border: 1px solid rgba(20, 83, 45, .14);
        border-radius: 1.25rem;
        background: #fff;
        padding: 2rem;
        box-shadow: 0 1.5rem 4rem rgba(15, 23, 42, .12);
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        object-fit: contain;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
        letter-spacing: -.04em;
      }
      p {
        margin: 1rem 0 0;
        color: #53665f;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 1.5rem;
        border-radius: .85rem;
        background: #16a34a;
        color: #fff;
        padding: .85rem 1rem;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="TOM">
      <h1>You are offline</h1>
      <p>This page is not available without a connection yet. Reconnect and try again.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
